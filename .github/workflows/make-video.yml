name: Make and upload a Short

on:
  schedule:
    - cron: "47 8 * * *"   # 8:47 UTC = 2:17 pm IST; GitHub often starts scheduled runs hours late, so this leaves room
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube (untick for a preview you can download from this page)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: make-video
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Render and upload
        env:
          PYTHONUNBUFFERED: "1"
          FAL_KEY: ${{ secrets.FAL_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m autotube.run ${{ (github.event_name == 'workflow_dispatch' && !inputs.upload) && '--no-upload' || '' }}
      - name: Keep the video as a downloadable file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Move finished scripts from queue/ to done/
        run: |
          git config user.name "autotube-bot"
          git config user.email "autotube-bot@users.noreply.github.com"
          git add -A queue done
          git diff --cached --quiet || (git commit -m "Uploaded: $(ls -t done | head -1)" && git pull --rebase origin "$GITHUB_REF_NAME" && git push)
