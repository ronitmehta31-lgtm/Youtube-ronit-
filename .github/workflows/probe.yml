name: Check services

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Try free AI pictures
        run: |
          P="an%20old%20indian%20woman%20in%20a%20village%2C%20storybook%20illustration"
          for q in "width=1024&height=576&model=flux" "width=1024&height=576&model=turbo" "width=768&height=432" ""; do
            curl -s -o img.bin -w "pollinations [$q]: HTTP %{http_code}, %{size_download} bytes, %{time_total}s, %{content_type}\n" \
              --max-time 70 "https://image.pollinations.ai/prompt/$P?$q&seed=3&nologo=true&referrer=autotube" || echo "pollinations [$q]: timed out"
          done
