name: Make channel art

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Generate profile picture and banner
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m autotube.channel_art
      - name: Save them to the repo
        run: |
          git config user.name "autotube-bot"
          git config user.email "autotube-bot@users.noreply.github.com"
          git add assets/channel
          git diff --cached --quiet || (git commit -m "Channel art" && git pull --rebase origin "$GITHUB_REF_NAME" && git push)
