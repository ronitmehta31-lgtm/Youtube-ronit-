name: Find a niche

on:
  workflow_dispatch:
    inputs:
      niches:
        description: 'Niches to compare, separated by commas (blank = the list in autotube/config.json)'
        required: false
        default: ""
      long:
        description: "Scan long videos (4-20 min) instead of Shorts"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scan YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          NICHES: ${{ github.event.inputs.niches }}
          LONG: ${{ inputs.long && '--long' || '' }}
        run: |
          IFS=',' read -ra LIST <<< "$NICHES"
          TRIMMED=()
          for n in "${LIST[@]}"; do n="$(echo "$n" | xargs)"; [ -n "$n" ] && TRIMMED+=("$n"); done
          python -m autotube.niche $LONG "${TRIMMED[@]}"
          cat reports/niches-latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the report
        run: |
          git config user.name "autotube-bot"
          git config user.email "autotube-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "Niche report $(date -u +%F)" && git pull --rebase origin "$GITHUB_REF_NAME" && git push)
